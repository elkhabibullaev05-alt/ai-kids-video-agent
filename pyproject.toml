[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-kids-video-agent"
version = "0.1.0"
description = "News-to-YouTube-Shorts workflow with Blender rendering and English narration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
render = ["imageio-ffmpeg>=0.5.1"]
publish = [
    "google-api-python-client>=2.180,<3",
    "google-auth-oauthlib>=1.2,<2",
    "tzdata>=2025.2",
]
automation = ["Pillow>=10.4,<13"]

[project.scripts]
ai-news-shorts = "ai_kids_video_agent.cli:main"
ocean-shorts = "ai_kids_video_agent.ocean_cli:main"
borough-file = "ai_kids_video_agent.series:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
